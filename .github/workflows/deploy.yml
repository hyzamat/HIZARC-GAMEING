# Builds the site and publishes it to GitHub Pages (hizarc.com) on every push to main.
# One-time setup: repo Settings → Pages → Source: "GitHub Actions", Custom domain: hizarc.com.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let an in-progress deploy finish; queue the newest one behind it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run build
        env:
          # Optional: set this repo variable (Settings → Secrets and variables → Actions → Variables)
          # to send the contact form to Formspree/Web3Forms. Only used when googleForm.action in src/config/site.ts is ''.
          VITE_CONTACT_ENDPOINT: ${{ vars.VITE_CONTACT_ENDPOINT }}

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  # Tells Bing, Yandex, Seznam, Naver & co. (IndexNow) that the site changed, so they recrawl it right away.
  # Google does not use IndexNow: it reads the sitemap submitted in Search Console instead.
  # The key must match the file public/<key>.txt, which proves we own hizarc.com. Never fails the deploy.
  indexnow:
    needs: deploy
    runs-on: ubuntu-latest
    continue-on-error: true
    env:
      INDEXNOW_KEY: b09c411fdf87e14be7c0215843f5c05c
    steps:
      - name: Ping IndexNow
        run: |
          curl -sS -m 30 -o response.txt -w "IndexNow HTTP %{http_code}\n" \
            -X POST https://api.indexnow.org/indexnow \
            -H "Content-Type: application/json; charset=utf-8" \
            -d "{\"host\":\"hizarc.com\",\"key\":\"$INDEXNOW_KEY\",\"keyLocation\":\"https://hizarc.com/$INDEXNOW_KEY.txt\",\"urlList\":[\"https://hizarc.com/\"]}"
          cat response.txt || true
